name: VPN UI candidate checks

on:
  push:
    branches:
      - integration/v080-awg31-tailscale-prep-20261011
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  formatting:
    name: Rust formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Check Rust formatting
        run: cargo +1.98.0 fmt --all -- --check

  compile-and-test:
    name: Build and offline tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Check Rust build
        run: cargo +1.98.0 check --locked

      - name: Run Rust tests
        run: cargo +1.98.0 test --locked

      - name: Build release executable
        run: cargo +1.98.0 build --release --locked

      - name: Stage installation safely in disposable filesystem
        run: python3 tests/stage_deployment.py

      - name: Smoke-test VPN UI over isolated localhost
        run: bash tests/smoke_web_local.sh

      - name: Test isolated AWG 3.1 helpers
        run: python3 -m unittest discover -s tests -p 'test_awg31_*.py' -v

      - name: Test WG/AWG 2.0 profile generators and privilege boundaries
        run: python3 -m unittest discover -s tests -p 'test_client_config_helpers.py' -v

      - name: Validate read-only wrappers and sudoers
        run: python3 -m unittest discover -s tests -p 'test_readonly_deployment.py' -v

      - name: Check helper syntax
        run: |
          set -eu
          for script in deploy/libexec/vpn-ui-manage deploy/libexec/vpn-ui-manage-core-v070 deploy/libexec/vpn-ui-awg31-client-config deploy/libexec/vpn-ui-awg31-status; do
            python3 - "$script" <<'PY'
          import ast
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          ast.parse(path.read_text(), filename=str(path))
          print("PYTHON OK:", path)
          PY
          done
          for script in deploy/libexec/vpn-ui-awg31-net deploy/bin/vpn-ui-awg31-client-config; do
            bash -n "$script"
            echo "SHELL OK: $script"
          done

      - name: Package verified Linux x86-64 binary for offline WSL lab
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          install -d -m 0755 release-artifact
          install -m 0755 target/release/vpn-ui release-artifact/vpn-ui
          (cd release-artifact && sha256sum vpn-ui > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > release-artifact/SOURCE_COMMIT

      - name: Upload isolated WSL lab binary
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: vpn-ui-v080-wsl-lab-linux-amd64
          path: release-artifact/
          if-no-files-found: error
          retention-days: 7
