name: Offline Ubuntu 22.04 WSL binary

on:
  push:
    branches:
      - integration/v080-awg31-tailscale-prep-20261011
    paths:
      - .github/workflows/build-ubuntu22-wsl.yml
      - Cargo.toml
      - Cargo.lock
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu22-wsl-binary:
    name: Build GLIBC 2.35 compatible Linux amd64 binary
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Build release executable
        run: cargo +1.98.0 build --release --locked

      - name: Assert GLIBC symbols are compatible with Ubuntu 22.04
        shell: bash
        run: |
          set -euo pipefail
          ldd --version | head -1
          file target/release/vpn-ui
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          exe = Path("target/release/vpn-ui")
          out = subprocess.run(
              ["objdump", "-T", str(exe)],
              capture_output=True, text=True, check=True,
          ).stdout
          required = {
              tuple(map(int, v.split(".")))
              for v in re.findall(r"GLIBC_([0-9]+\.[0-9]+)", out)
          }
          high = max(required, default=(0, 0))
          print("Highest required GLIBC:", ".".join(map(str, high)))
          if high > (2, 35):
              raise SystemExit("FAIL: binary requires newer glibc than Ubuntu 22.04")
          PY

      - name: Exercise built executable without VPN devices
        run: bash tests/smoke_web_local.sh

      - name: Package verified executable
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0755 artifact
          install -m 0755 target/release/vpn-ui artifact/vpn-ui
          (cd artifact && sha256sum vpn-ui > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > artifact/SOURCE_COMMIT
          printf 'Ubuntu 22.04 LTS / glibc <= 2.35 / x86_64\n' > artifact/BUILD_TARGET

      - name: Upload Ubuntu 22.04 binary for isolated WSL test
        uses: actions/upload-artifact@v4
        with:
          name: vpn-ui-v080-ubuntu22-wsl-amd64
          path: artifact/
          retention-days: 7
          if-no-files-found: error
