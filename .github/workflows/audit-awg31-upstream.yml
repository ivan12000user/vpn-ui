name: Audit pinned AWG 3.1 upstream source

on:
  push:
    branches:
      - integration/v080-awg31-tailscale-prep-20261011
    paths:
      - .github/workflows/audit-awg31-upstream.yml
      - deploy/RELEASE_READINESS.md

permissions:
  contents: read

jobs:
  build-upstream:
    name: Source provenance and userspace build (no VPN)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Install exact Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: false

      - name: Fetch exact upstream source revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v3.1.20260828 --single-branch             https://github.com/amnezia-vpn/amneziawg-go.git upstream
          actual="$(git -C upstream rev-parse HEAD)"
          expected="b5928efb6ca19f0153958460c3d141f04abc5c2e"
          echo "Verified source commit: $actual"
          test "$actual" = "$expected"
          test -f upstream/LICENSE
          grep -q 'Permission is hereby granted' upstream/LICENSE
          grep -q '^go 1.25.0$' upstream/go.mod

      - name: Build executable without running it
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          make
          file ./amneziawg-go
          sha256sum ./amneziawg-go
          go version -m ./amneziawg-go

      - name: Compare output checksum to audited production sample
        shell: bash
        run: |
          set -euo pipefail
          expected=6177066f0e35b1cb44945136d9a10841dd3ce30fdf16009c9a815cd943a982fe
          actual="$(sha256sum upstream/amneziawg-go | awk '{print $1}')"
          if [ "$actual" = "$expected" ]; then
            echo "Build checksum MATCHES the previously audited VPS binary"
          else
            echo "Build checksum differs from VPS binary: this does not prove a different source revision"
            echo "Compiler versions, flags, build paths and metadata can change hashes"
          fi
          echo "Unprivileged build only. No production keys, services or tunnels accessed."
