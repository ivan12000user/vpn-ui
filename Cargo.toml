[package]
name = "vpn-ui"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Unified self-hosted Web UI for WireGuard and AmneziaWG"
license = "MIT"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.5", features = ["trace"] }
