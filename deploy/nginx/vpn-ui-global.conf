server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 308 https://$host$request_uri;
}

# Compatibility redirect for the old VPN-only UI port.
# Keep the existing address-specific sockets to avoid wildcard bind conflicts
# during migration from the old configuration.
server {
    listen 10.66.66.1:5005;
    listen 10.77.77.1:5005;
    server_name _;

    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/vpn-ui.crt;
    ssl_certificate_key /etc/nginx/ssl/vpn-ui.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    auth_basic "VPN UI";
    auth_basic_user_file /etc/nginx/vpn-ui-admin.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
