# pl-vmpico: HTTPS entry point for the already-installed vpn-ui service.
# No passwords, certificate material, or client keys are stored in Git.
server {
    listen 0.0.0.0:443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/vpn-ui-old/server.crt;
    ssl_certificate_key /etc/nginx/ssl/vpn-ui-old/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    error_log /var/log/nginx/vpn-ui-auth-error.log warn;
    auth_basic "VPN UI";
    auth_basic_user_file /etc/nginx/vpn-ui-old-admin.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
